<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="/static/style.css">
    <title>Register Page</title>
</head>

<body>
    <nav class="navbar navbar-dark bg-info">
        <div class="container">
            <div class="navbar-brand">
                <a class="navbar-brand fw-bold fs-4" href="/">TrekEase</a>
            </div>


        </div>
    </nav><br>
    <div class="text-center">
        <h2>Welcome to TrekEase</h2>
        <p>Create your account for expeditions</p>
    </div>
    <div class="container">
        <div id="form-body">
        <form class="row g-3" action="/register/{{role}}" method="POST">

            <div class="col-12">
                <label for="inputAddress" class="form-label">Name</label>
                <input type="text" class="form-control" id="inputAddress" placeholder="Enter your name" name="name" required>
            </div>
            <div class="col-md-6">
                <label for="inputEmail4" class="form-label">Username</label>
                <input type="Text" class="form-control" id="inputEmail4" name="username" required>
            </div>
            <div class="col-md-6">
                <label for="inputPassword4" class="form-label">Password</label>
                <input type="password" class="form-control" id="inputPassword4" name="password" required>
            </div>
            <div class="col-12">
                <label for="inputAddress" class="form-label">Email</label>
                <input type="Email" class="form-control" id="inputAddress" placeholder="Example@gmail.com" name="email" required>
            </div>
            <div class="col-12">
                <label for="inputAddress2" class="form-label">Phone No.</label>
                <input type="text" class="form-control" id="inputAddress2" name="phone_no" required>
            </div>
            <div class="col-12">
                <div class="form-check">
                    <input class="form-check-input" type="checkbox" id="gridCheck">
                    <label class="form-check-label" for="gridCheck" required>
                        Agree to Term and Conditions.
                    </label>
                </div>
            </div>
            <div class="text-center d-grid gap-2">
                <input type="submit" class="btn btn-success rounded-4" value="Register">
            </div>
            <div class="text-center">
                <p>- or -</p>
                <p>Already have a account? <a class="link-opacity-7-hover" href="/login">Sign in</a></p>
            </div>

        </form>
        </div>
    </div>

</body>

</html>
