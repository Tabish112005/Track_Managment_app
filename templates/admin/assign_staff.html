<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="/static/style.css">
    <title>Assign Staff Page</title>
</head>

<body class="d-flex flex-column min-vh-100 bg-light">

    <nav class="navbar navbar-expand-lg navbar-dark bg-info shadow-sm">
        <div class="container">
            <div class="navbar-brand">
                <a class="navbar-brand fw-bold fs-4" href="/admin_dashboard">TrekEase</a>
            </div>
            <ul class="nav align-items-center">
                <li class="nav-item"><a class="nav-link active link-light" href="/admin_dashboard">Dashboard</a></li>
                <li class="nav-item"><a class="nav-link link-light" href="/treks">Treks</a></li>
                <li class="nav-item"><a class="nav-link link-light" href="/staff">Staff</a></li>
                <li class="nav-item"><a class="nav-link link-light" href="/pending_staff">Applications</a></li>
                <li class="nav-item"><a class="nav-link link-light" href="/users">Trekkers</a></li>
                <li class="nav-item"><a class="nav-link link-light" href="/bookings">Bookings</a></li>
                <li class="nav-item ms-2">
                    <a href="/" class="btn btn-outline-light rounded-4">Logout</a>
                </li>
            </ul>
        </div>
    </nav>
    <br>
    
    <div class="container my-4" style="max-width: 600px;">
        <div class="card p-4 rounded-4 shadow-sm border-0 bg-white">
            <h2 class="text-center fw-semibold text-dark mb-1">{{trek.trek_name}}</h2>
            <p class="text-muted text-center border-bottom pb-3">{{trek.location}}</p>
            
            <form action="/assign_staff/{{trek.id}}" method="POST">
                <div class="mb-3">
                    <label class="form-label fw-semibold text-secondary">Select Staff</label>
                    <select name="staff_id" class="form-select rounded-3" required>
                        <option value ="select" selected>Select Staff</option>
                        {% for staff in available_staff %}
                        <option value="{{staff.id}}">{{staff.id}} - {{staff.name}}</option>
                        {% endfor %}
                    </select>
                </div>
                <div class="d-grid mt-4">
                    <input type="submit" class="btn btn-success btn-lg rounded-3 fw-semibold" value="Assign">
                </div>
            </form>
        </div>
    </div>

</body>
</html>
